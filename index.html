<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bulb Toggle</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    img {
      width: 300px;
      border-radius: 12px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <img id="bulb" src="cboff.png" alt="Bulb">

    <br>

    <button id="btn" onclick="changeBulb()">
      Turn On
    </button>
  </div>
  <audio id="onSound" src="sound.mp3"></audio>
<audio id="offSound" src="sound.mp3"></audio>

  <script>
    let isOn = false;

    function changeBulb() {
      let bulb = document.getElementById("bulb");
      let btn = document.getElementById("btn");
      let sound = document.getElementById("clickSound");

      if (isOn) {
        bulb.src = "cboff.png";
        btn.innerText = "Turn On";
        isOn = false;
      } else {
        bulb.src = "cbon.png";
        btn.innerText = "Turn Off";
        isOn = true;
      }
    }
  </script>

</body>
</html>
